<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحميل مُنافِس</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#f7f1e3; --card:#fffaf0; --ink:#2a2620; --muted:#75716a; --deep:#0f4c3a; --on:#f7ebd0; --line:#e6dcc6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14120f; --card:#1d1a16; --ink:#efe7d6; --muted:#a69e8f; --deep:#2e8a6c; --line:#2f2a23; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:Cairo, system-ui, sans-serif; line-height:1.8; }
  main { max-width:560px; margin:0 auto; padding:40px 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:28px 22px; text-align:center; }
  h1 { margin:0 0 4px; font-size:32px; color:var(--deep); }
  .muted { color:var(--muted); }
  .btn { display:inline-block; margin-top:20px; background:var(--deep); color:var(--on); text-decoration:none; font-weight:700; font-size:18px; padding:14px 34px; border-radius:14px; }
  ol { text-align:right; padding-inline-start:20px; margin:24px 0 0; }
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>مُنافِس</h1>
    <div class="muted">اقرأ كتب العلم الشرعي على دروس قصيرة، واختبر فهمك، ونافس غيرك.</div>
    <a class="btn" id="dl" href="https://github.com/itiswd/monafes-releases/releases/latest/download/monafes.apk">تحميل لأندرويد</a>
    <div class="muted" id="ver">أحدث إصدار</div>
    <ol class="muted">
      <li>حمّل الملف ثم افتحه.</li>
      <li>إن طُلب منك، اسمح للمتصفح بتثبيت التطبيقات.</li>
      <li>بعد ذلك يصلك كل تحديث جديد داخل التطبيق نفسه.</li>
    </ol>
  </div>
</main>
<script>
  // Reads the newest release, so this page never needs editing per release.
  const repo = 'itiswd/monafes-releases';
  fetch(`https://api.github.com/repos/${repo}/releases/latest`)
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(rel => {
      document.getElementById('ver').textContent = 'الإصدار ' + rel.tag_name.replace(/^v/, '');
    })
    .catch(() => {});
</script>
</body>
</html>
